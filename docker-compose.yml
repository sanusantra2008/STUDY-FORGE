version: '3.8'

services:
  studyforge:
    build: .
    container_name: studyforge-ai
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-google}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemma-4-26b-a4b-it}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - PORT=${PORT:-8000}
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/uploads
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      # Persistent storage without clobbering application code in /app
      - studyforge_uploads:/app/uploads
      - studyforge_db:/app/data
    extra_hosts:
      # Allows backend container to access Ollama on host machine
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  studyforge_uploads:
  studyforge_db:
